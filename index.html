<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>The HipHop Project</title>
		<style>
			html, body {
				margin: 0;
				height: 100%;
				background: #000;
			}

			#splash {
				display: flex;
				align-items: center;
				justify-content: center;
				min-height: 100vh;
				min-height: 100dvh;
				box-sizing: border-box;
				padding: 16px;
			}

			#splash a {
				display: block;
				max-width: 1500px;
				text-decoration: none;
				width: 100%;
			}

			.splash {
				display: block;
				width: 100%;
				height: auto;
				max-height: calc(100vh - 90px);
				max-height: calc(100dvh - 90px);
				object-fit: contain;
			}

			.enter {
				display: block;
				margin-top: 16px;
				text-align: center;
				color: #fff;
				font: 20px 'Ubuntu Condensed', sans-serif;
				letter-spacing: 4px;
				text-transform: uppercase;
				text-decoration: none;
			}
		</style>
		<link href='https://fonts.googleapis.com/css?family=Ubuntu+Condensed' rel='stylesheet' type='text/css'>
	</head>
	<body>
		<div id="splash">
			<a href="gallery.html">
				<img class="splash" src="images/splash_current.jpg" alt="The Metropolitan Museum of Art: The Hip Hop Project, translating rap lyrics into art encounters">
				<span class="enter">Enter &rarr;</span>
			</a>
		</div>
	</body>
</html>
